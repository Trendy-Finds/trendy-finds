name: Fix product videos
on:
  push:
    paths:
      - '.github/workflows/fix-product-videos.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set videos by product name
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          def set_video(product, video_id):
              pattern = rf"(name:'{re.escape(product)}'.{{0,2000}}?video:')[^']*(')"
              new, count = re.subn(pattern, rf"\g<1>{video_id}\g<2>", s, count=1, flags=re.S)
              return new, count

          for product, video in [
              ('LCD Writing Tablet', 'U-9aVyrj250'),
              ('P9 Wireless Bluetooth Headphones', 'P2AG63NeqAA'),
              ('Washer Gun', 'FhGslPtVRpg'),
          ]:
              s, count = set_video(product, video)
              print(product, 'updated' if count else 'NOT FOUND')

          s = s.replace('P47 Wireless Bluetooth Headphones', 'P9 Wireless Bluetooth Headphones')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Fix product video assignments'
            git push
          fi
